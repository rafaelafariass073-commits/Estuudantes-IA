<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estudantes IA — O Assistente de Estudos</title>
    <style>
        :root {
            --bg-principal: #fbfaf7;
            --bg-card: #ffffff;
            --bg-usuario: #f3ece3;
            --texto-principal: #191919;
            --texto-secundario: #6b7280;
            --marca-primaria: #cc6b49;
            --marca-hover: #b55a3a;
            --borda-suave: rgba(234, 221, 207, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-principal); color: var(--texto-principal); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; background-color: var(--bg-principal);
            border-bottom: 1px solid var(--borda-suave); position: sticky; top: 0; z-index: 50;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; }
        .logo-box {
            width: 34px; height: 34px; background-color: var(--marca-primaria); color: white;
            border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
        }
        .nav-title h1 { font-size: 14px; font-weight: 700; }
        .nav-title p { font-size: 10px; color: var(--texto-secundario); }
        .status-badge {
            display: flex; align-items: center; gap: 6px; font-size: 11px; color: #065f46;
            background-color: #ecfdf5; padding: 4px 10px; border-radius: 9999px; border: 1px solid #d1fae5; font-weight: 600;
        }
        .status-dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; }
        main { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; padding: 0 16px; }
        #chat-box { flex: 1; overflow-y: auto; padding-top: 24px; padding-bottom: 150px; display: flex; flex-direction: column; gap: 24px; }
        .msg-row { display: flex; align-items: flex-start; gap: 12px; width: 100%; }
        .msg-row.user { justify-content: flex-end; }
        .avatar {
            width: 32px; height: 32px; border-radius: 8px; background-color: rgba(204, 107, 73, 0.1);
            border: 1px solid rgba(204, 107, 73, 0.15); display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .msg-content { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .msg-author { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #9ca3af; }
        .msg-text { font-size: 15px; line-height: 1.5; color: #242424; max-width: 95%; word-break: break-word; }
        .user-bubble {
            background-color: var(--bg-usuario); border: 1px solid rgba(234, 221, 207, 0.3);
            padding: 12px 16px; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.5; color: #1a1a1a; max-width: 85%; word-break: break-word;
        }
        .input-area { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, var(--bg-principal) 80%, transparent); padding: 20px 16px 16px 16px; }
        .input-container { background-color: var(--bg-card); border: 1px solid #e2d9cf; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; box-shadow: 0 10px 30px -10px rgba(125, 83, 57, 0.12); }
        textarea { width: 100%; background: transparent; border: none; resize: none; outline: none; color: var(--texto-principal); font-size: 15px; line-height: 1.5; font-family: inherit; min-height: 36px; max-height: 120px; }
        .input-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f5efe6; }
        .hint-text { font-size: 11px; color: var(--texto-secundario); }
        button { background-color: var(--marca-primaria); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: var(--marca-hover); }
        .dots { display: flex; gap: 4px; padding: 6px 0; }
        .dot { width: 6px; height: 6px; background-color: var(--marca-primaria); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <div class="logo-box">E</div>
            <div class="nav-title"><h1>Estudantes IA</h1><p>Engine: Gemini 1.5 Flash</p></div>
        </div>
        <div class="status-badge"><div class="status-dot"></div><span>Online</span></div>
    </nav>

    <main>
        <div id="chat-box">
            <div class="msg-row">
                <div class="avatar">🎓</div>
                <div class="msg-content">
                    <p class="msg-author">Estudantes IA</p>
                    <div class="msg-text">Olá! Sou a <strong>Estudantes IA</strong>. Toda a estrutura do servidor foi corrigida e está pronta para uso. O que vamos estudar hoje?</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <textarea id="user-input" rows="1" placeholder="Pergunte qualquer dúvida acadêmica..." autocomplete="off"></textarea>
                <div class="input-footer">
                    <div class="hint-text">Aperte Enter para enviar</div>
                    <button id="send-btn">Enviar</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6IBoDVBRbPaPocFzKycMYJddRrDgm46YiQSTHgmNQnC2g";

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        userInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

        async function processarMensagem() {
            const promptOriginal = userInput.value.trim();
            if (!promptOriginal) return;

            userInput.value = ''; userInput.style.height = 'auto';
            chatBox.innerHTML += `<div class="msg-row user"><div class="user-bubble">${promptOriginal.replace(/\n/g, '<br>')}</div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const hashId = "ai-engine-" + Date.now();
            chatBox.innerHTML += `<div class="msg-row"><div class="avatar">🎓</div><div class="msg-content"><p class="msg-author">Estudantes IA</p><div id="${hashId}" class="msg-text"><div class="dots"><span class="dot">●</span><span class="dot">●</span><span class="dot">●</span></div></div></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // FIX DEFINITIVO: Rota completa e oficial do endpoint do Gemini restaurada
                const response = await fetch(`https://googleapis.com`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "X-Goog-Api-Key": GEMINI_API_KEY 
                    },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Você é a Estudantes IA, responda de forma didática e direta: " + promptOriginal }] }] })
                });

                const payload = await response.json();
                let respostaTexto = payload.candidates[0].content.parts[0].text;
                
                respostaTexto = respostaTexto.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>\$1</strong>');
                document.getElementById(hashId).innerHTML = respostaTexto;
            } catch (error) {
                document.getElementById(hashId).innerHTML = `<span style="color: #ef4444; font-weight: 600;">[Erro] O servidor da API recusou a requisição. Certifique-se de que a sua chave está ativa e configurada corretamente no painel do Google.</span>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', processarMensagem);
        userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !isMobile) { e.preventDefault(); processarMensagem(); } });
    </script>
</body>
</html>
